<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>nuncio</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0e1013; --fg: #e8e6e3; --dim: #8b9199; --line: #23272e;
    --done: #4ade80; --need: #fbbf24; --err: #f87171; --work: #60a5fa;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fbfaf9; --fg: #1a1d21; --dim: #6b7280; --line: #e4e2df; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  }
  header { width: 100%; max-width: 620px; display: flex; align-items: center;
           justify-content: space-between; gap: 12px; margin-bottom: 28px; }
  .brand { font-weight: 600; letter-spacing: -0.01em; }
  .brand span { color: var(--dim); font-weight: 400; }
  main { width: 100%; max-width: 620px; flex: 1; display: flex;
         flex-direction: column; gap: 20px; }

  .status { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--dim); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.WORKING { background: var(--work); animation: pulse 1.4s ease-in-out infinite; }
  .dot.PENDING { background: var(--need); }
  .dot.SPEAKING { background: var(--done); }
  .dot.error { background: var(--err); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .card { border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .card.waiting { border-color: var(--need); }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
           color: var(--dim); margin-bottom: 10px; }
  .report { font-size: 17px; line-height: 1.6; white-space: pre-wrap; }
  .files { margin-top: 14px; font-size: 13px; color: var(--dim);
           word-break: break-all; }
  .meta { margin-top: 12px; font-size: 12px; color: var(--dim); }

  button {
    font: inherit; font-weight: 550; cursor: pointer; border-radius: 11px;
    border: 1px solid var(--line); background: transparent; color: var(--fg);
    padding: 13px 18px; transition: background .12s, border-color .12s;
  }
  button:hover:not(:disabled) { background: color-mix(in oklab, var(--fg) 8%, transparent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); width: 100%; }
  .row { display: flex; gap: 10px; }
  .row button { flex: 1; }
  .idle { color: var(--dim); text-align: center; padding: 40px 0; }
  .warn { border: 1px solid var(--need); border-radius: 11px; padding: 12px 14px;
          font-size: 14px; color: var(--need); }
</style>
</head>
<body>
<header>
  <div class="brand">nuncio <span id="conn">connecting</span></div>
  <div class="row" style="gap:8px">
    <button id="mode" style="font-size:13px;padding:8px 12px">Quiet</button>
    <button id="enable" style="font-size:13px;padding:8px 12px">Enable sound</button>
  </div>
</header>
<div style="width:100%;max-width:620px;margin-bottom:18px" class="status">
  <label for="rate" style="flex:none">Speed</label>
  <input type="range" id="rate" min="0.6" max="1.4" step="0.05" style="flex:1;max-width:220px" />
  <span id="rateValue" style="flex:none;min-width:2.6em"></span>
</div>

<main>
  <div class="status"><span class="dot" id="dot"></span><span id="stateLabel">…</span></div>
  <div id="body"></div>
</main>

<script>
// ---------------------------------------------------------------------------
// Audio. Three tones, generated with WebAudio so no sound files are needed.
// You learn what happened from the tone alone, without looking at anything.
// ---------------------------------------------------------------------------
let audio = null;
let soundReady = false;

function enableSound() {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  // Browsers block audio until a user gesture. Speech has the same rule, so prime it too.
  try { speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch {}
  soundReady = true;
  document.getElementById("enable").textContent = "Sound on";
  document.getElementById("enable").disabled = true;
  if (window.Notification && Notification.permission === "default") Notification.requestPermission();
}
document.getElementById("enable").addEventListener("click", enableSound);

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
const modeButton = document.getElementById("mode");
const rateInput = document.getElementById("rate");
const rateValue = document.getElementById("rateValue");

function paintMode() {
  modeButton.textContent = mode === "live" ? "Live" : "Quiet";
  modeButton.title =
    mode === "live"
      ? "Speaks every report as it arrives. Click for Quiet."
      : "Only speaks when you ask. Click for Live.";
}

modeButton.addEventListener("click", () => {
  mode = mode === "live" ? "quiet" : "live";
  localStorage.setItem("nuncio.mode", mode);
  if (mode === "live" && !soundReady) enableSound();
  paintMode();
});

function paintRate() { rateValue.textContent = `${rate.toFixed(2)}x`; }

rateInput.addEventListener("input", () => {
  rate = Number(rateInput.value);
  localStorage.setItem("nuncio.rate", String(rate));
  paintRate();
});

const TONES = {
  // done: two notes rising. Neutral, easy to ignore.
  "done":      [[660, 0], [880, 0.11]],
  // needs-you: three quick notes. Distinctly more urgent.
  "needs-you": [[880, 0], [880, 0.13], [1170, 0.26]],
  // error: two notes falling, low. Unmistakable.
  "error":     [[440, 0], [300, 0.16]],
};

function ping(kind) {
  if (!soundReady || !audio) return;
  for (const [freq, at] of TONES[kind] || TONES.done) {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    const t = audio.currentTime + at;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.16, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + 0.18);
  }
}

function notify(text) {
  if (!window.Notification || Notification.permission !== "granted") return;
  if (document.visibilityState === "visible") return;
  try { new Notification("nuncio", { body: text, silent: true }); } catch {}
}

// ---------------------------------------------------------------------------
// Speech
//
// Browsers ignore SSML break tags, so pauses cannot be marked up in the text. Instead each
// sentence is its own utterance and the silence between them is real waiting. The daemon
// decides how long each pause should be: long at a topic change, short inside one thought,
// scaled by how dense the sentence was.
// ---------------------------------------------------------------------------
let rate = Number(localStorage.getItem("nuncio.rate") || "1.0");
let cancelled = false;

function stopSpeaking() {
  cancelled = true;
  try { speechSynthesis.cancel(); } catch {}
}

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

function sayOne(text) {
  return new Promise((resolve) => {
    try {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = rate;
      utterance.onend = resolve;
      utterance.onerror = resolve;
      speechSynthesis.speak(utterance);
    } catch { resolve(); }
  });
}

/** Speak a list of {text, pauseAfterMs}. Returns when finished or cancelled. */
async function speakChunks(chunks, onProgress) {
  stopSpeaking();
  cancelled = false;
  for (let i = 0; i < chunks.length; i++) {
    if (cancelled) return false;
    if (onProgress) onProgress(i, chunks.length);
    await sayOne(chunks[i].text);
    if (cancelled) return false;
    if (chunks[i].pauseAfterMs > 0) await sleep(chunks[i].pauseAfterMs);
  }
  return !cancelled;
}

/** Fallback for plain strings with no chunking. */
function speak(text, onEnd) {
  speakChunks([{ text, pauseAfterMs: 0 }]).then(() => onEnd && onEnd());
}

// ---------------------------------------------------------------------------
// Connection
// ---------------------------------------------------------------------------
let socket = null;
let state = null;
let lastWaitingKey = null;
let lastPlayedKey = null;
let lastChunks = [];
let lastSpokenIndex = 0;

// Quiet is the junior-developer model: it waits until you ask. Live plays each report as it
// arrives, for when you are walking with earphones and cannot click anything.
let mode = localStorage.getItem("nuncio.mode") || "quiet";

function send(kind) { try { socket.send(JSON.stringify({ kind })); } catch {} }

function connect() {
  socket = new WebSocket(`ws://${location.host}/ws`);
  socket.onopen = () => { document.getElementById("conn").textContent = ""; };
  socket.onclose = () => {
    document.getElementById("conn").textContent = "reconnecting";
    setTimeout(connect, 1200);
  };
  socket.onmessage = (event) => {
    state = JSON.parse(event.data);
    render();
  };
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
const LABELS = {
  IDLE: "Nothing running",
  WORKING: "Agent is working",
  PENDING: "Waiting for you",
  SPEAKING: "Speaking",
};

function render() {
  if (!state) return;
  const queue = state.queue || [];
  const waiting = queue[0] || null;

  const dot = document.getElementById("dot");
  dot.className = "dot " + (waiting && waiting.ping === "error" ? "error" : state.state);
  document.getElementById("stateLabel").textContent =
    (LABELS[state.state] || state.state) + (queue.length > 1 ? `  ·  ${queue.length - 1} more waiting` : "");

  // Ping once per new waiting item, never on a re-render.
  const key = waiting ? waiting.ping + "|" + waiting.report.text : null;
  if (key && key !== lastWaitingKey) {
    ping(waiting.ping);
    notify(waiting.ping === "needs-you" ? "Needs your answer" : waiting.report.text.slice(0, 90));
  }
  lastWaitingKey = key;

  const body = document.getElementById("body");

  if (!waiting) {
    const history = state.history || [];
    const working = state.state === "WORKING";

    body.innerHTML = `
      <div class="idle">${working
        ? "Working. You will hear a tone when it needs you."
        : "Nothing waiting."}</div>
      ${working ? `<div class="row"><button class="primary" id="progress">Where are you?</button></div>` : ""}
      ${history.length ? `<div class="label" style="margin-top:26px">Recent — click to hear again</div>` : ""}
      ${history.map((h, i) => `
        <div class="card" style="margin-top:10px;cursor:pointer" data-history="${i}">
          <div class="label">${escapeHtml(sourceLabel(h.report.source))}</div>
          <div class="report" style="font-size:15px">${escapeHtml(h.report.text)}</div>
        </div>`).join("")}`;

    if (working) {
      document.getElementById("progress").onclick = () => {
        if (!soundReady) enableSound();
        speak(progressSentence());
      };
    }

    for (const card of body.querySelectorAll("[data-history]")) {
      card.onclick = () => {
        if (!soundReady) enableSound();
        const item = history[Number(card.getAttribute("data-history"))];
        // Replay reads what is already held. It never asks the agent again.
        speakChunks([...item.report.chunks, ...(item.report.restChunks || [])]);
      };
    }
    return;
  }

  const report = waiting.report;
  const speaking = state.state === "SPEAKING";
  // The rest is already in memory. Asking for it never goes back to the agent.
  const hasMore = report.rest && report.rest.length > 0;

  body.innerHTML = `
    ${soundReady ? "" : `<div class="warn">Press “Enable sound” once so the browser lets nuncio play audio.</div>`}
    <div class="card waiting">
      <div class="label">${escapeHtml(sourceLabel(report.source))}</div>
      <div class="report" id="reportText">${escapeHtml(report.text)}</div>
      ${report.files.length ? `<div class="files">Changed: ${escapeHtml(report.files.join(", "))}</div>` : ""}
      ${hasMore ? `<div class="meta">There is more — ${report.fullWords} words in total.</div>` : ""}
      ${report.source === "fallback" ? `<div class="meta">The agent wrote no summary block.</div>` : ""}
    </div>
    <div class="row" style="margin-top:16px">
      <button class="primary" id="listen">${speaking ? "Speaking…" : "Listen"}</button>
      ${hasMore ? `<button id="more">More</button>` : ""}
      <button id="again" title="Repeat the last sentence only">Again</button>
      <button id="dismiss">Dismiss</button>
    </div>`;

  const play = async (chunks, thenDone) => {
    if (!soundReady) enableSound();
    lastChunks = chunks;
    const finished = await speakChunks(chunks, (i) => { lastSpokenIndex = i; });
    if (finished && thenDone) send("ui.done");
  };

  document.getElementById("listen").onclick = () => {
    send("ui.open");
    const chunks = [...report.chunks];
    // Only offer the rest aloud when there actually is one.
    if (hasMore) chunks.push({ text: "There is more, if you want it.", pauseAfterMs: 0 });
    play(chunks, !hasMore);
  };

  if (hasMore) {
    document.getElementById("more").onclick = () => {
      send("ui.more");
      play(report.restChunks, true);
    };
  }

  document.getElementById("again").onclick = () => {
    // Just the last sentence, not the whole report. That is what you actually missed.
    const chunk = lastChunks[lastSpokenIndex];
    if (chunk) play([{ text: chunk.text, pauseAfterMs: 0 }], false);
  };

  document.getElementById("dismiss").onclick = () => {
    stopSpeaking();
    send("ui.done");
  };

  // In Live mode the report plays itself. In Quiet mode nothing is spoken until you click.
  if (mode === "live" && soundReady && key !== lastPlayedKey) {
    lastPlayedKey = key;
    document.getElementById("listen").click();
  }
}

/**
 * What nuncio can honestly say mid-run.
 *
 * Mechanical, because that is all it knows — the agent writes its report at the end, so there
 * is no narrative yet. Real progress needs <<STEP>> markers, which are measured but not enabled.
 */
function progressSentence() {
  const files = (state.filesThisTurn || []).map((p) => p.split(/[\\/]/).pop());
  const started = state.turnStartedAt;
  const mins = started ? Math.round((Date.now() - started) / 60000) : 0;

  const time = !started ? "" : mins < 1 ? " It started less than a minute ago." : ` It has been going about ${mins} minute${mins === 1 ? "" : "s"}.`;

  if (files.length === 0) return `Still working. Nothing written yet.${time}`;
  if (files.length <= 3) return `Still working. It has changed ${files.join(", ")}.${time}`;
  return `Still working. It has changed ${files.length} files, including ${files.slice(0, 3).join(", ")}.${time}`;
}

function sourceLabel(source) {
  return { block: "Report", fallback: "Report (no summary)", permission: "Permission needed",
           question: "Question", error: "Error" }[source] || "Report";
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

rateInput.value = String(rate);
paintRate();
paintMode();
connect();
</script>
</body>
</html>
